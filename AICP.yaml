# aicp.yaml
# AICP Configuration

# Server
host: 0.0.0.0
port: 9000

# Directories
plugins_dir: plugins
data_dir: data
static_dir: www

# LLM Configuration
models:
  default: claude-sonnet-4-6
  max_retries: 3
  request_timeout: 60
  stream_timeout: 300
  max_concurrent: 10
  
  providers:
    openai:
      base_url: https://api.openai.com/v1
      api_key: ${OPENAI_API_KEY}
      models:
        - id: gpt-4
          max_tokens: 8192
          temperature: 0.7
    
    aggregator:
      base_url: https://gpt-agent.cc/v1
      api_key: ${AGGREGATOR_API_KEY}
      models:
        - id: claude-sonnet-4-6
          max_tokens: 8192
          temperature: 0.7
          default: true
        - id: deepseek-v4-pro
          max_tokens: 8192
          temperature: 0.8
        - id: kimi-for-coding
          max_tokens: 8192
          temperature: 0.3
    