<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历评估 - Resume Evaluator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #1a1a2e; margin-bottom: 30px; font-size: 28px; }
        
        .upload-area { background: white; border-radius: 16px; padding: 40px; text-align: center; border: 2px dashed #d1d5db; transition: all 0.3s; cursor: pointer; margin-bottom: 30px; }
        .upload-area:hover { border-color: #4f46e5; background: #f8fafc; }
        .upload-area.dragover { border-color: #4f46e5; background: #eef2ff; }
        .upload-icon { font-size: 48px; margin-bottom: 16px; }
        .upload-text { color: #6b7280; font-size: 16px; }
        .upload-text span { color: #4f46e5; font-weight: 600; }
        input[type="file"] { display: none; }
        .file-info { margin-top: 16px; padding: 12px 20px; background: #eef2ff; border-radius: 8px; display: inline-block; color: #4f46e5; font-weight: 500; }
        
        .btn { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; border: none; padding: 14px 32px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .loading { display: none; text-align: center; padding: 40px; }
        .spinner { width: 50px; height: 50px; border: 4px solid #e5e7eb; border-top-color: #4f46e5; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .report { display: none; background: white; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .report h2 { color: #1a1a2e; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #e5e7eb; }
        
        .score-card { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .score-item { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 24px; border-radius: 12px; text-align: center; }
        .score-item h3 { font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
        .score-item .score { font-size: 36px; font-weight: 700; }
        .score-item .max { font-size: 16px; opacity: 0.8; }
        
        .section { margin-bottom: 24px; }
        .section h3 { color: #374151; font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .section h3::before { content: ''; width: 4px; height: 18px; background: #4f46e5; border-radius: 2px; }
        .grade-list { display: grid; gap: 12px; }
        .grade-item { background: #f9fafb; padding: 16px; border-radius: 10px; border-left: 4px solid #4f46e5; }
        .grade-item .label { font-weight: 600; color: #374151; margin-bottom: 4px; }
        .grade-item .comment { color: #6b7280; font-size: 14px; }
        
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .two-col { grid-template-columns: 1fr; } }
        
        .list-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; }
        .list-item::before { content: '•'; color: #4f46e5; font-weight: bold; }
        
        .summary-box { background: linear-gradient(135deg, #f3f4f6, #e5e7eb); padding: 24px; border-radius: 12px; line-height: 1.8; color: #374151; }
        
        .error { background: #fef2f2; border: 1px solid #fca5a5; color: #dc2626; padding: 16px; border-radius: 10px; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 简历智能评估</h1>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">拖拽简历到此处，或 <span>点击选择文件</span></div>
            <div class="upload-text" style="font-size: 12px; margin-top: 8px;">支持 PDF、Word、TXT 格式</div>
            <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt">
            <div class="file-info" id="fileInfo" style="display:none;"></div>
        </div>
        
        <div style="text-align: center; margin-bottom: 30px;">
            <button class="btn" id="evalBtn" disabled onclick="evalResume()">开始评估</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>AI 正在分析简历，请稍候...</div>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="report" id="report"></div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const evalBtn = document.getElementById('evalBtn');
        const loading = document.getElementById('loading');
        const report = document.getElementById('report');
        const errorDiv = document.getElementById('error');
        
        let selectedFile = null;
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length) handleFile(files[0]);
        });
        
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) handleFile(fileInput.files[0]);
        });
        
        function handleFile(file) {
            const validTypes = ['application/pdf', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'text/plain'];
            const ext = file.name.split('.').pop().toLowerCase();
            
            if (!['pdf', 'doc', 'docx', 'txt'].includes(ext)) {
                showError('请上传 PDF、Word 或 TXT 格式的文件');
                return;
            }
            
            selectedFile = file;
            fileInfo.style.display = 'inline-block';
            fileInfo.textContent = `📄 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            evalBtn.disabled = false;
            errorDiv.style.display = 'none';
        }
        
        async function evalResume() {
            if (!selectedFile) return;
            
            loading.style.display = 'block';
            report.style.display = 'none';
            errorDiv.style.display = 'none';
            evalBtn.disabled = true;
            
            try {
                const content = await readFileAsText(selectedFile);
                const base64Content = btoa(unescape(encodeURIComponent(content)));
                
                const resp = await fetch('/api/resume/eval', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        file: base64Content,
                        filename: selectedFile.name
                    })
                });
                
                const data = await resp.json();
                
                if (data.error) {
                    showError(data.error);
                } else {
                    renderReport(data);
                }
            } catch (err) {
                showError('评估失败: ' + err.message);
            } finally {
                loading.style.display = 'none';
                evalBtn.disabled = false;
            }
        }
        
        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }
        
        function renderReport(data) {
            const r = data.report;
            const grades = r.grades || {};
            
            report.innerHTML = `
                <h2>📊 评估报告</h2>
                
                <div class="score-card">
                    <div class="score-item">
                        <h3>总分</h3>
                        <div class="score">${r.total_score || 0}</div>
                        <div class="max">/ 100</div>
                    </div>
                    <div class="score-item" style="background: linear-gradient(135deg, #10b981, #059669);">
                        <h3>基本信息</h3>
                        <div class="score">${grades.basic_info?.score || 0}</div>
                        <div class="max">/ 20</div>
                    </div>
                    <div class="score-item" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
                        <h3>教育背景</h3>
                        <div class="score">${grades.education?.score || 0}</div>
                        <div class="max">/ 15</div>
                    </div>
                    <div class="score-item" style="background: linear-gradient(135deg, #ef4444, #dc2626);">
                        <h3>工作经历</h3>
                        <div class="score">${grades.experience?.score || 0}</div>
                        <div class="max">/ 25</div>
                    </div>
                    <div class="score-item" style="background: linear-gradient(135deg, #06b6d4, #0891b2);">
                        <h3>技能展示</h3>
                        <div class="score">${grades.skills?.score || 0}</div>
                        <div class="max">/ 20</div>
                    </div>
                    <div class="score-item" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed);">
                        <h3>项目经验</h3>
                        <div class="score">${grades.projects?.score || 0}</div>
                        <div class="max">/ 20</div>
                    </div>
                </div>
                
                <div class="two-col">
                    <div class="section">
                        <h3>💪 优点</h3>
                        <div class="grade-list">
                            ${(r.strengths || []).map(s => `<div class="list-item">${s}</div>`).join('')}
                        </div>
                    </div>
                    <div class="section">
                        <h3>⚠️ 待改进</h3>
                        <div class="grade-list">
                            ${(r.weaknesses || []).map(w => `<div class="list-item">${w}</div>`).join('')}
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h3>💡 改进建议</h3>
                    <div class="grade-list">
                        ${(r.suggestions || []).map(s => `<div class="list-item">${s}</div>`).join('')}
                    </div>
                </div>
                
                <div class="section">
                    <h3>📝 总体评价</h3>
                    <div class="summary-box">${r.summary || '暂无评价'}</div>
                </div>
                
                <div style="text-align: center; margin-top: 30px;">
                    <button class="btn" onclick="window.print()">🖨️ 打印报告</button>
                    <button class="btn" onclick="location.reload()" style="margin-left: 16px;">📄 重新评估</button>
                </div>
            `;
            
            report.style.display = 'block';
            report.scrollIntoView({ behavior: 'smooth' });
        }
        
        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
