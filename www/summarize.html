<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 700px; padding: 32px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        h1 { font-size: 24px; color: #333; }
        .lang-toggle { display: flex; gap: 8px; }
        .lang-btn { padding: 8px 16px; border: 2px solid #ddd; background: white; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .lang-btn.active { background: #4a90d9; color: white; border-color: #4a90d9; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; color: #666; margin-bottom: 8px; }
        textarea { width: 100%; height: 180px; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; resize: vertical; transition: border-color 0.2s; }
        textarea:focus { outline: none; border-color: #4a90d9; }
        .btn { width: 100%; padding: 14px; background: #4a90d9; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #3a7bc8; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .result { margin-top: 24px; display: none; }
        .result.show { display: block; }
        .result-section { margin-bottom: 20px; }
        .result-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .summary-text { background: #f8f9fa; padding: 16px; border-radius: 8px; color: #333; line-height: 1.6; }
        .keywords { display: flex; flex-wrap: wrap; gap: 8px; }
        .keyword { background: #e8f4fd; color: #4a90d9; padding: 6px 12px; border-radius: 20px; font-size: 13px; }
        .error { color: #d94a4a; margin-top: 12px; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="title">Text Summarizer</h1>
            <div class="lang-toggle">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="zh">中文</button>
            </div>
        </div>
        <div class="input-group">
            <label id="inputLabel">Paste your long text here...</label>
            <textarea id="inputText" placeholder="Enter text to summarize..."></textarea>
        </div>
        <button class="btn" id="summarizeBtn">Summarize</button>
        <div class="error" id="errorMsg"></div>
        <div class="result" id="result">
            <div class="result-section">
                <div class="result-label" id="summaryLabel">Summary</div>
                <div class="summary-text" id="summaryText"></div>
            </div>
            <div class="result-section">
                <div class="result-label" id="keywordsLabel">Keywords</div>
                <div class="keywords" id="keywordsContainer"></div>
            </div>
        </div>
    </div>
    <script>
        const i18n = {
            en: {
                title: "Text Summarizer",
                inputLabel: "Paste your long text here...",
                placeholder: "Enter text to summarize...",
                summarizeBtn: "Summarize",
                summaryLabel: "Summary",
                keywordsLabel: "Keywords",
                minLength: "Text too short, minimum 50 characters",
                processing: "Processing...",
                error: "Error occurred"
            },
            zh: {
                title: "文本摘要生成器",
                inputLabel: "在此粘贴长文本...",
                placeholder: "输入要摘要的文本...",
                summarizeBtn: "生成摘要",
                summaryLabel: "摘要",
                keywordsLabel: "关键词",
                minLength: "文本太短，最少需要50个字符",
                processing: "处理中...",
                error: "发生错误"
            }
        };

        let currentLang = "en";
        const titleEl = document.getElementById("title");
        const inputLabelEl = document.getElementById("inputLabel");
        const inputTextEl = document.getElementById("inputText");
        const summarizeBtnEl = document.getElementById("summarizeBtn");
        const errorMsgEl = document.getElementById("errorMsg");
        const resultEl = document.getElementById("result");
        const summaryTextEl = document.getElementById("summaryText");
        const keywordsContainerEl = document.getElementById("keywordsContainer");
        const langBtns = document.querySelectorAll(".lang-btn");

        function switchLang(lang) {
            currentLang = lang;
            langBtns.forEach(btn => {
                btn.classList.toggle("active", btn.dataset.lang === lang);
            });
            const t = i18n[lang];
            titleEl.textContent = t.title;
            inputLabelEl.textContent = t.inputLabel;
            inputTextEl.placeholder = t.placeholder;
            summarizeBtnEl.textContent = t.summarizeBtn;
            summarizeBtnEl.disabled = false;
        }

        langBtns.forEach(btn => {
            btn.addEventListener("click", () => switchLang(btn.dataset.lang));
        });

        summarizeBtnEl.addEventListener("click", async () => {
            const text = inputTextEl.value.trim();
            errorMsgEl.style.display = "none";
            resultEl.classList.remove("show");

            if (text.length < 50) {
                errorMsgEl.textContent = i18n[currentLang].minLength;
                errorMsgEl.style.display = "block";
                return;
            }

            summarizeBtnEl.disabled = true;
            summarizeBtnEl.textContent = i18n[currentLang].processing;

            try {
                const res = await fetch("/api/summarize", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({content: text, lang: currentLang})
                });
                const data = await res.json();

                if (data.error) {
                    errorMsgEl.textContent = data.error;
                    errorMsgEl.style.display = "block";
                } else {
                    summaryTextEl.textContent = data.summary;
                    keywordsContainerEl.innerHTML = data.keywords.map(k => 
                        `<span class="keyword">${k}</span>`
                    ).join("");
                    resultEl.classList.add("show");
                }
            } catch (e) {
                errorMsgEl.textContent = i18n[currentLang].error;
                errorMsgEl.style.display = "block";
            } finally {
                summarizeBtnEl.disabled = false;
                summarizeBtnEl.textContent = i18n[currentLang].summarizeBtn;
            }
        });
    </script>
</body>
</html>
